name: Test PR Guard
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JNewtons/pr-size-guard@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}