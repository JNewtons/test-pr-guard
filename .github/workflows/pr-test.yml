name: PR Guard
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JNewtons/pr-size-guard@v1.2   # bruk @v1.2 for testing nå; bytt til @v1 etterpå
        with:
          max_lines: "400"
          test_paths: "tests,__tests__"
          exclude: "**/package-lock.json,**/*.min.js"
          mode: "warn"
          retries: "2"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
